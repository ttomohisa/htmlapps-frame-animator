name: Frame Animator browser regression

on:
  pull_request:
    paths:
      - 'src/index.template.html'
      - 'scripts/rc-browser-test.mjs'
      - 'build-standalone.ps1'
      - '.github/workflows/frame-animator-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build standalone app
        shell: pwsh
        run: ./build-standalone.ps1
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise drag, mobile, animation and offline regressions
        run: node scripts/rc-browser-test.mjs
      - name: Attach screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-animator-browser-screenshots
          path: |
            assets/screenshot.png
            assets/screenshot-en.png
            assets/screenshot-mobile.png
          if-no-files-found: ignore

# One-time project-scope installer. Remove this workflow after the generated skill is checked in.
name: Impeccable project bootstrap
on:
  push:
    branches:
      - feat/impeccable-frame-animator-ux
    paths:
      - .github/workflows/impeccable-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official Codex skill into this project
        run: npx --yes impeccable@4.8.1 install --providers=codex --scope=project
      - name: Check version and official hook setup
        shell: bash
        run: |
          npx --yes impeccable@4.8.1 --version
          if npx --yes impeccable@4.8.1 hooks on; then
            echo "Impeccable hooks on succeeded"
          else
            echo "::warning::Hook auto-enable was unavailable; local Codex trust must be reviewed"
          fi
      - name: Commit project-local installation only
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Impeccable installed with no generated changes"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: install Impeccable Codex skill v4.8.1 [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

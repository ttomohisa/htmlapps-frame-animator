name: Impeccable design review
on:
  pull_request:
    paths:
      - 'src/index.template.html'
      - 'DESIGN.md'
      - 'PRODUCT.md'
      - 'docs/IMPECCABLE*'
      - '.agents/skills/impeccable/**'
      - '.impeccable/**'
      - '.github/workflows/impeccable-design-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check installed engine version
        run: .agents/skills/impeccable/scripts/impeccable --version
      - name: Load project design context
        run: .agents/skills/impeccable/scripts/impeccable context --target src/index.template.html
      - name: Run official automatic design detector
        shell: bash
        run: |
          set +e
          .agents/skills/impeccable/scripts/impeccable detect --json src/index.template.html > impeccable-detect.json 2> impeccable-detect.err
          exit_code=$?
          set -e
          cat impeccable-detect.err
          cat impeccable-detect.json
          echo "Detector status: $exit_code (0: no findings; 2: findings)"
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 2 ]; then exit "$exit_code"; fi
      - name: Archive detector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-frame-animator-findings
          path: |
            impeccable-detect.json
            impeccable-detect.err
          if-no-files-found: ignore

name: Frame Animator v0.9 RC browser audit

on:
  push:
    branches:
      - release/frame-animator-v0.9.0
    paths:
      - .github/workflows/rc-v09-browser.yml
      - scripts/rc-browser-test.mjs
      - src/index.template.html
      - app.config.json
      - dependencies.json
      - dependencies.lock.json

permissions:
  contents: write

jobs:
  rc-browser:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/frame-animator-v0.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate repository and build standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Install Playwright for RC audit
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Run RC browser regression
        shell: pwsh
        run: node ./scripts/rc-browser-test.mjs

      - name: Commit RC screenshots and generated standalone HTML
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot.png assets/screenshot-en.png assets/screenshot-mobile.png frame-animator.html
          git rm .github/workflows/rc-v09-browser.yml
          git commit -m "test: capture v0.9.0 RC browser audit"
          git push origin HEAD:release/frame-animator-v0.9.0

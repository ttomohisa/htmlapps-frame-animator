name: Frame Animator v0.9 RC gap audit

on:
  push:
    branches:
      - release/frame-animator-v0.9.0
    paths:
      - .github/workflows/rc-v09-gap-audit.yml
      - scripts/rc-browser-test.mjs

permissions:
  contents: read

jobs:
  rc-browser:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/frame-animator-v0.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate repository and build standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Install Playwright for RC audit
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Run RC browser regression
        shell: pwsh
        run: node ./scripts/rc-browser-test.mjs

name: Publish GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Serialize main and tag runs so a tag and its release cannot be created twice.
concurrency:
  group: frame-animator-github-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ttomohisa/htmlapps-frame-animator'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan versioned release
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -Raw -Encoding UTF8 app.config.json | ConvertFrom-Json
          $version = [string]$config.version
          $tag = "v$version"
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid stable app.config.json version: $version."
          }

          $fromMain = $env:RELEASE_REF -ceq 'refs/heads/main'
          if (-not $fromMain -and $env:RELEASE_REF -cne "refs/tags/$tag") {
            throw "Pushed tag must exactly match app.config.json: $tag."
          }

          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch main.' }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Refusing a release whose commit is not included in main.'
          }

          $tagRef = "refs/tags/$tag"
          $remoteTags = @(git ls-remote --refs --tags origin $tagRef)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to query existing release tags.' }
          if ($remoteTags.Count -gt 1) { throw "Unexpected duplicate tag ref $tagRef." }
          $tagExists = $remoteTags.Count -eq 1
          if (-not $fromMain -and -not $tagExists) {
            throw "Tag-push event has no matching remote tag: $tag."
          }

          if ($tagExists) {
            git fetch origin $tagRef
            if ($LASTEXITCODE -ne 0) { throw "Unable to fetch existing $tagRef." }
            $tagCommit = (git rev-parse 'FETCH_HEAD^{commit}').Trim()
            if ($LASTEXITCODE -ne 0) { throw "Unable to resolve existing $tagRef." }
            $currentCommit = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the triggering commit.' }
          }

          $releaseUrl = gh release view $tag --repo $env:GITHUB_REPOSITORY --json url --jq .url 2>$null
          $alreadyReleased = $LASTEXITCODE -eq 0
          if ($alreadyReleased -and -not $tagExists) {
            throw "Release $tag exists but its tag cannot be found."
          }

          $publish = $true
          if ($alreadyReleased) {
            Write-Host "Release $tag already exists. Skipping without changing it."
            $publish = $false
          } elseif ($fromMain -and $tagExists -and $tagCommit -cne $currentCommit) {
            throw "Tag $tag already points to $tagCommit, not the current main commit $currentCommit."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "create_tag=$((($fromMain -and -not $tagExists)).ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Tag: $tag | publish: $publish | create on main: $($fromMain -and -not $tagExists)"

      - name: Validate PowerShell syntax and encoding
        if: steps.plan.outputs.publish == 'true'
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Assemble release files and verify ZIP and SHA-256
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG

      - name: Create version tag and publish GitHub Release
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          CREATE_TAG: ${{ steps.plan.outputs.create_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $repository = [string](Get-Content -Raw -Encoding UTF8 app.config.json |
            ConvertFrom-Json).repository.name
          if ($env:CREATE_TAG -eq 'true') {
            $sha = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve commit to tag.' }
            # A lightweight tag points at the exact main commit that passed verification.
            gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f "ref=refs/tags/$tag" -f "sha=$sha" --silent
            if ($LASTEXITCODE -ne 0) { throw "Failed to create tag $tag." }
          }

          $names = @(
            "$repository-$tag.html",
            "$repository-$tag.self-extract.html",
            "$repository-$tag.zip",
            'SHA256SUMS.txt'
          )
          $files = @($names | ForEach-Object {
            $file = Join-Path 'release-assets' $_
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Release asset missing: $file"
            }
            $file
          })
          gh release create $tag @files --verify-tag --latest --repo $env:GITHUB_REPOSITORY `
            --title "Frame Animator $tag" --notes-file release-assets/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release $tag." }

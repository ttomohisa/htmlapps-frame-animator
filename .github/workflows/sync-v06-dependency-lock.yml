name: Sync v0.6 dependency lock

on:
  push:
    branches:
      - feat/frame-animator-v0.6.0
    paths:
      - dependencies.json
      - .github/workflows/sync-v06-dependency-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frame-animator-v0.6.0
      - name: Sync jsquash-webp lock
        shell: pwsh
        run: ./scripts/sync-dependency-lock.ps1
      - name: Commit lock
        shell: pwsh
        run: |
          if (git status --porcelain dependencies.lock.json) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dependencies.lock.json
            git commit -m "build: lock jsquash-webp 1.5.0"
            git push origin HEAD:feat/frame-animator-v0.6.0
          }
